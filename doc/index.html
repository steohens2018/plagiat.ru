<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Документы</title>
<meta name="description" content="Служебные документы по образцу: уведомления, рапорты, акты, ориентировки. Данные остаются на устройстве.">
<meta name="robots" content="noindex">
<!-- Скрипты — только свои файлы (никакого встроенного кода); сеть — только нейросети
     (Pollinations без ключа; Pollinations, OpenRouter, Gemini — по ключу пользователя) и справочник индексов. wasm-unsafe-eval и worker blob: нужны распознаванию фото (Tesseract, WebAssembly). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data: https://text.pollinations.ai https://gen.pollinations.ai https://openrouter.ai https://generativelanguage.googleapis.com https://suggestions.dadata.ru; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Документы">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* =============================================================================
   «Документы» — чат-помощник по служебным документам.
   Спокойный светлый фон «бумага», тёмно-синий акцент (как у значка), текст
   крупный и ровный. Слева — чаты, в центре — переписка, внизу — поле ввода.
   (Имена переменных --gold* оставлены — это просто «акцент».)
   ============================================================================= */
:root{
  --bg:#f7f6f2; --s1:#ffffff; --s2:#f1efe9; --s3:#ffffff; --side:#efede6;
  --brd:rgba(28,34,60,.10); --brd2:rgba(28,34,60,.20);
  --txt:#1c1e26; --txt2:rgba(28,30,38,.78); --dim:rgba(28,30,38,.56);
  --gold:#1b46a0; --gold2:#1f4fae; --goldS:rgba(27,70,160,.08); --goldB:rgba(27,70,160,.35);
  --navy:#0c2b66;
  --red:#b3412f; --grn:#2f7a45;
  --serif:Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --top:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--gold);text-decoration:none}
button{font:inherit;cursor:pointer}

.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{width:280px;flex:none;background:var(--side);border-right:1px solid var(--brd);display:flex;flex-direction:column;gap:10px;
  padding:14px 12px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));
  position:sticky;top:0;height:100vh;height:100dvh}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy)}
.lg{width:34px;height:34px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;
  font-family:'Times New Roman',Georgia,serif;font-size:18px;color:#fff}
.bn{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.01em}
.side input{font-size:14px;padding:9px 12px;background:var(--s1)}
.side-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.side-g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:12px 10px 4px}
.side-i{display:flex;align-items:center;border-radius:10px}
.side-i a{flex:1;min-width:0;padding:9px 10px;color:var(--txt);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-i.on{background:rgba(28,34,60,.08)}
.side-i .x{font-size:18px;padding:4px 10px;opacity:.55}
.side-f{display:flex;flex-direction:column;border-top:1px solid var(--brd);padding-top:8px}
.side-f a,.side-f button{display:block;text-align:left;border:0;background:transparent;color:var(--txt2);font-size:14px;padding:9px 10px;border-radius:10px}
.side-f a.on{background:rgba(28,34,60,.08);color:var(--txt)}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;
  display:flex;align-items:center;gap:4px;background:var(--bg);border-bottom:1px solid var(--brd)}
.top-t{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--txt2);font-size:22px}
.ic-btn:active{background:rgba(28,34,60,.08)}
#sideClose{display:none}
/* Экран пароля и первого входа — без панели и верхней строки */
body[data-state=locked] .side,body[data-state=locked] .top,body[data-state=locked] .scrim{display:none!important}
@media(min-width:900px){#menuBtn{visibility:hidden}}
@media(max-width:899px){
  .side{position:fixed;left:0;top:0;z-index:60;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s ease}
  body.side-open .side{transform:none;box-shadow:0 0 40px rgba(12,43,102,.25)}
  body.side-open .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(12,20,45,.35)}
  #sideClose{display:inline-flex}
}

/* Чат */
body[data-view=chat] .wrap{display:flex;flex-direction:column;flex:1;padding-bottom:0}
.chat{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:18px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.u{justify-content:flex-end}
.bub{max-width:86%;background:var(--s2);border-radius:18px;padding:10px 14px;overflow-wrap:anywhere}
.bub-t{white-space:pre-wrap}
.bub .chips{margin:0 0 6px}
.av{width:28px;height:28px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Times New Roman',Georgia,serif;font-size:15px;margin-top:2px}
.msg-b{flex:1;min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 10px 22px}
.md li{margin-bottom:4px}
.md code{background:var(--s2);border-radius:5px;padding:1px 5px;font-size:.92em}
.msg.err .md{color:var(--red)}
.doc-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;background:var(--s1);border:1px solid var(--brd2);border-radius:14px;padding:12px 14px;
  box-shadow:0 1px 2px rgba(12,43,102,.06)}
.doc-ic{width:40px;height:40px;flex:none;border-radius:10px;background:var(--goldS);color:var(--gold);display:flex;align-items:center;justify-content:center}
.doc-b{flex:1 1 150px;min-width:0}
.doc-t{font-weight:600;color:var(--navy)}
.doc-s{font-size:12.5px;color:var(--dim)}
.doc-a{display:flex;gap:6px}
.doc-old{margin-top:8px;font-size:12.5px;color:var(--dim)}
.hintbox{margin-top:10px;border:1px solid var(--brd);border-left:2px solid var(--gold);border-radius:4px 12px 12px 4px;padding:8px 12px;font-size:13px;color:var(--txt2)}
.hintbox summary{cursor:pointer;color:var(--gold);font-weight:500}
.hintbox div{white-space:pre-wrap;margin-top:6px}
.used{margin-top:8px;font-size:12px;color:var(--dim)}
.find{margin-top:10px;background:var(--s1);border:1px solid var(--brd);border-left:2px solid var(--gold);border-radius:4px 12px 12px 4px;padding:10px 12px}
.find-h{font-weight:600;color:var(--navy);font-size:14px}
.find-t{margin-top:6px;font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--txt)}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.acts button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--dim);font-size:12.5px;padding:5px 8px;border-radius:8px}
.acts button:active{background:rgba(28,34,60,.08)}
.pend .msg-b{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px;min-height:28px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
.hello{margin:auto 0;padding:6vh 0 3vh;text-align:center}
.hello-t{font-family:var(--serif);font-size:clamp(30px,8vw,40px);color:var(--navy);line-height:1.1}
.hello-s{color:var(--txt2);font-size:15px;margin:10px auto 20px;max-width:440px}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.starter{border:1px solid var(--brd2);background:var(--s1);color:var(--txt);border-radius:999px;padding:9px 14px;font-size:14px}
.starter:active{background:var(--s2)}
.hello .card{text-align:left}
.linkbtn{border:0;background:transparent;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px}
.composer{position:sticky;bottom:0;z-index:10;background:linear-gradient(to bottom,transparent,var(--bg) 14px);padding:14px 0 max(10px,env(safe-area-inset-bottom))}
.comp-box{background:var(--s1);border:1px solid var(--brd2);border-radius:20px;padding:10px 10px 8px 14px;box-shadow:0 4px 18px rgba(12,43,102,.08)}
.comp-box:focus-within{border-color:var(--goldB)}
.comp-box .chips:not(:empty){margin:0 0 8px}
#msg{display:block;border:0;background:transparent;padding:4px 0;min-height:28px;max-height:40vh;resize:none;border-radius:0;font-size:16px;line-height:1.45}
.comp-row{display:flex;align-items:center;gap:8px;margin-top:4px;margin-left:-8px}
.comp-hint{flex:1;min-width:0;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.send:disabled{opacity:.35}
.comp-note{font-size:11.5px;color:var(--dim);text-align:center;margin-top:8px}
.chip.ro{padding-right:12px;background:rgba(28,34,60,.06);border-color:var(--brd);color:var(--txt2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;-webkit-appearance:auto;appearance:auto;padding:0}

.wrap{width:100%;max-width:780px;margin:0 auto;padding:22px 16px 80px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:'Times New Roman',Georgia,serif;font-weight:700;color:var(--navy);font-size:clamp(30px,7vw,42px);line-height:1.08;margin-bottom:8px}
.lead{color:var(--txt2);font-size:14px;margin-bottom:20px}

.card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(12,43,102,.05)}
.card-t{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid .full{grid-column:1/-1}
@media(max-width:420px){.grid .half3{grid-column:1/-1}}
label.f{display:block}
label.f span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;max-width:100%;background:var(--s2);border:1px solid var(--brd2);border-radius:10px;color:var(--txt);
  font:inherit;font-size:16px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--goldB)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
textarea.big{min-height:150px}
input[type=date],input[type=time]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;
  border:1px solid var(--brd2);background:#fff;color:var(--navy);font-size:15px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.seg{display:flex;gap:4px;background:var(--s2);border:1px solid var(--brd);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--txt2);padding:9px 10px;border-radius:9px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--goldS);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldB)}

.case{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--brd)}
.case:last-child{border-bottom:0}
.case-b{flex:1;min-width:0;color:var(--txt)}
.case-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-m{font-size:12px;color:var(--dim)}
.x{border:0;background:transparent;color:var(--dim);font-size:20px;padding:6px 10px}

.note{border:1px solid var(--brd);border-left:2px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;
  font-size:13px;color:var(--txt2);background:var(--s1);margin-bottom:12px}
.warn{border-left-color:var(--red)}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--brd)}
.photo input{margin-top:6px;font-size:14px;padding:8px 10px}

/* Вложения к задаче */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:not(:empty){margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;background:var(--goldS);color:var(--navy);border:1px solid var(--goldB);
  border-radius:999px;padding:4px 4px 4px 12px;font-size:13px}
.chip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:transparent;color:var(--navy);font-size:17px;line-height:1;padding:2px 8px}
.dl{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:5;background:var(--bg);padding:8px 0;margin-bottom:6px}
.dl>.btn{flex:1 1 0;padding-left:8px;padding-right:8px;white-space:nowrap}
.dl>.btn:first-child{flex:1.7 1 0}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:' ▾'}
details.card[open]>summary::after{content:' ▴'}

/* Ожидание: что сейчас делается */
.busy{position:fixed;inset:0;z-index:70;background:rgba(247,246,242,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.busy-b{background:#fff;border:1px solid var(--brd2);border-radius:14px;padding:22px 24px;max-width:320px;text-align:center;box-shadow:0 6px 24px rgba(12,43,102,.15)}
.busy-t{margin-top:12px;color:var(--navy);font-weight:500}
.spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid var(--goldS);border-top-color:var(--navy);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Окна: просмотр документа и подтверждение отправки в ИИ */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,20,45,.92);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.modal-h{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.modal-t{font-family:'Times New Roman',Georgia,serif;font-size:22px;font-weight:700;color:#fff}
.modal-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.payload{background:var(--s1);border:1px solid var(--brd2);padding:14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--txt2)}
.payload mark{background:var(--goldS);color:var(--gold);border-radius:4px;padding:0 2px}

/* Лист A4 в предпросмотре: размеры в пунктах, масштаб под ширину экрана */
.paper-wrap{container-type:inline-size;max-width:760px;margin:0 auto}
.paper{background:#fff;color:#000;font-family:'Times New Roman',Times,serif;border-radius:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.3);
  --k:calc(100cqw / 595);line-height:1.15;overflow:hidden}
.paper .pg{padding:calc(var(--mt) * var(--k)) calc(var(--mr) * var(--k)) calc(var(--mb) * var(--k)) calc(var(--ml) * var(--k));min-height:calc(842 * var(--k))}
.paper .pg+.pg{border-top:6px solid #333}
.paper p{font-size:calc(var(--s) * var(--k));min-height:1.15em;white-space:pre-wrap}
.paper .t{display:flex}
.paper .t>div{flex:none}
.paper .tab{display:flex;justify-content:space-between}
.paper img{display:block;margin:0 auto}

.toasts{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--brd2);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px rgba(12,43,102,.25);animation:tin .25s ease}
.toast.error{border-color:rgba(217,128,111,.5)}
.toast.success{border-color:rgba(141,187,148,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Печать (PDF): только лист документа, в натуральную величину */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .paper{--k:1pt;border-radius:0;margin:0}
  #printArea .pg{min-height:auto;break-after:page;border:0!important}
  #printArea .pg:last-child{break-after:auto}
}
#printArea{display:none}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-h">
      <a class="brand" href="#new"><div class="lg">Д</div><div class="bn">Документы</div></a>
      <button class="ic-btn" id="sideClose" aria-label="Закрыть меню">×</button>
    </div>
    <a class="btn gold wide" href="#new" id="newChat">Новый чат</a>
    <input id="sideSearch" type="search" placeholder="Поиск по чатам" autocomplete="off">
    <nav class="side-list" id="chatList" aria-label="Чаты"></nav>
    <div class="side-f">
      <a href="#laws" data-r="laws">База: образцы, нормы, памятки</a>
      <a href="#settings" data-r="settings">Настройки</a>
      <button id="lockBtn">Заблокировать</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="ic-btn" id="menuBtn" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="top-t" id="topTitle">Документы</div>
      <a class="ic-btn" href="#new" id="newBtn" aria-label="Новый чат"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    </header>
    <main class="wrap" id="app"></main>
  </div>
</div>
